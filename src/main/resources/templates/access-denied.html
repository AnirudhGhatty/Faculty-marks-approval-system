
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied | Faculty Marks Approval System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container text-center">
        <div class="card border-0 shadow-sm mx-auto p-4"
             style="max-width: 500px; border-radius: 16px;">

            <div class="mb-3">
                <span class="text-danger" style="font-size: 64px;">
                    &#9888;
                </span>
            </div>

            <h2 class="fw-bold mb-3">Access Denied</h2>

            <p class="text-secondary mb-4">
                Sorry, you don't have permission to access this page.
                Please return to your dashboard or sign in with an
                account that has the required permissions.
            </p>

            <div class="d-grid gap-2">
                <button onclick="history.back()"
                        class="btn btn-primary">
                    Go Back
                </button>

                <a th:href="@{/login}" class="btn btn-outline-secondary">
                    Return to Login
                </a>
            </div>

            <hr class="my-4">

            <small class="text-secondary">
                Faculty Marks Approval System
            </small>
        </div>
    </div>

</body>
</html>
