
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard - Marks Approval System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                Marks Approval System
            </span>

            <div class="d-flex align-items-center">
                <span class="text-white">
                    Student
                </span>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-light btn-sm ms-3">
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <h2 class="mb-4">Student Dashboard</h2>

        <div class="card mb-4">

            <div class="card-header bg-primary text-white">
                Student Information
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">
                        <strong>Name:</strong>
                        <p th:text="${student.name}">Student Name</p>
                    </div>

                    <div class="col-md-4">
                        <strong>Student ID:</strong>
                        <p th:text="${student.rollNo}">Student ID</p>
                    </div>

                    <div class="col-md-4">
                        <strong>Email:</strong>
                        <p th:text="${student.email}">Student Email</p>
                    </div>

                </div>

            </div>
        </div>

        <div class="card mb-4">

            <div class="card-header bg-primary text-white">
                Marks Summary
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-light">
                            <tr>
                                <th>Subject</th>
                                <th>External Marks</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="subject : ${subjects}">

                                <td th:text="${subject.subjectName}">
                                    Subject Name
                                </td>

                                <td>
                                    <span th:if="${externalMarksBySubject[subject.subjectId] != null}"
                                          th:text="${externalMarksBySubject[subject.subjectId]}">
                                    </span>

                                    <span th:unless="${externalMarksBySubject[subject.subjectId] != null}">
                                        —
                                    </span>
                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(subjects)}">
                                <td colspan="2" class="text-center">
                                    No subjects found.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>
        </div>

        <div class="text-center">

            <a href="/student-results" class="btn btn-primary">
                View Detailed Results
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
