
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results - Marks Approval System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">

            <span class="navbar-brand mb-0 h1">
                Marks Approval System
            </span>

            <div class="d-flex align-items-center">

                <span class="text-white">
                    Student
                </span>

                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-light btn-sm ms-3">
                        Logout
                    </button>
                </form>

            </div>

        </div>
    </nav>

    <div class="container mt-4">

        <h2 class="mb-4">Student Results</h2>

        <div class="card mb-4">

            <div class="card-header bg-primary text-white">
                Student Information
            </div>

            <div class="card-body">

                <div class="row">

                    <div class="col-md-4">
                        <strong>Name:</strong>
                        <p th:text="${student.name}">Student Name</p>
                    </div>

                    <div class="col-md-4">
                        <strong>Student ID:</strong>
                        <p th:text="${student.rollNo}">Student ID</p>
                    </div>

                    <div class="col-md-4">
                        <strong>Semester:</strong>
                        <p th:text="${student.semester}">Semester</p>
                    </div>

                </div>

            </div>

        </div>

        <div class="card">

            <div class="card-header bg-primary text-white">
                Detailed Results
            </div>

            <div class="card-body">

                <form method="get" th:action="@{/student-results}" class="mb-4">

                    <div class="row align-items-end">

                        <div class="col-md-4">

                            <label for="ncp" class="form-label">
                                Select NCP
                            </label>

                            <select id="ncp"
                                    name="ncp"
                                    class="form-select"
                                    onchange="this.form.submit()">

                                <option value="NCP1"
                                        th:selected="${selectedNcp == 'NCP1'}">
                                    NCP 1
                                </option>

                                <option value="NCP2"
                                        th:selected="${selectedNcp == 'NCP2'}">
                                    NCP 2
                                </option>

                                <option value="NCP3"
                                        th:selected="${selectedNcp == 'NCP3'}">
                                    NCP 3
                                </option>

                            </select>

                        </div>

                    </div>

                </form>

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-light">

                            <tr>
                                <th>Subject</th>
                                <th>Credits</th>
                                <th th:text="${selectedNcp + ' Marks'}">
                                    NCP Marks
                                </th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="subject : ${subjects}"
                                th:with="record=${ncpMarksBySubject[subject.subjectId]}">

                                <td th:text="${subject.subjectName}">
                                    Subject Name
                                </td>

                                <td th:text="${subject.credits}">
                                    Credits
                                </td>

                                <td>

                                    <span th:if="${record != null and selectedNcp == 'NCP1' and record.ncp1Locked == true and record.ncp1 != null}"
                                          th:text="${record.ncp1}">
                                    </span>

                                    <span th:if="${record != null and selectedNcp == 'NCP2' and record.ncp2Locked == true and record.ncp2 != null}"
                                          th:text="${record.ncp2}">
                                    </span>

                                    <span th:if="${record != null and selectedNcp == 'NCP3' and record.ncp3Locked == true and record.ncp3 != null}"
                                          th:text="${record.ncp3}">
                                    </span>

                                    <span th:if="${record == null
                                                or (selectedNcp == 'NCP1' and (record.ncp1Locked != true or record.ncp1 == null))
                                                or (selectedNcp == 'NCP2' and (record.ncp2Locked != true or record.ncp2 == null))
                                                or (selectedNcp == 'NCP3' and (record.ncp3Locked != true or record.ncp3 == null))}">
                                        —
                                    </span>

                                </td>

                            </tr>

                            <tr th:if="${#lists.isEmpty(subjects)}">
                                <td colspan="3" class="text-center">
                                    No subjects found.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <div class="text-center mt-4">

            <a href="/student-dashboard" class="btn btn-secondary">
                Back to Dashboard
            </a>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
